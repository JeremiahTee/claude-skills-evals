name: ci

on:
  push:
  pull_request:
  workflow_dispatch:  # a manual run makes gitleaks scan the full history; push/PR scan their own commits

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # setup-python ships 3.9 builds for 22.04 and 24.04 only
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Selftest (unit tests + mutants + lint of examples/skills)
        run: bash tests/selftest.sh
      - name: Canary regression gate (committed results, no model call)
        run: python3 -m skillevals gate

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks reads git log: commit ranges on push/PR, all history on workflow_dispatch
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # lists PR commits; no license needed for a personal-account repo
          GITLEAKS_ENABLE_COMMENTS: "false"  # comments would need pull-requests: write
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"  # findings stay in the (redacted) job log
